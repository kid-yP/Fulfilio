services:
  - type: web
    name: fulfilio-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fulfilio-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: CLIENT_URL
        value: http://localhost:3000
      # REDIS_URL will be added manually after creating an Upstash Redis database
    healthCheckPath: /health/ready

  - type: worker
    name: fulfilio-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fulfilio-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      # REDIS_URL will be added manually after creating an Upstash Redis database

databases:
  - name: fulfilio-postgres
    plan: free