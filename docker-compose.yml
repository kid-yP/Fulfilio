services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fulfilio
      POSTGRES_PASSWORD: fulfilio
      POSTGRES_DB: fulfilio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fulfilio:fulfilio@postgres:5432/fulfilio
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fulfilio:fulfilio@postgres:5432/fulfilio
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - /app/node_modules
      - ./api/prisma:/app/prisma
    command: sh -c "npx prisma generate --schema=./prisma/schema.prisma && npm run dev"

volumes:
  postgres_data: