name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fulfilio
          POSTGRES_PASSWORD: fulfilio
          POSTGRES_DB: fulfilio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulfilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fulfilio:fulfilio@localhost:5432/fulfilio_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-not-for-prod-aaaaaaaaaa
      JWT_REFRESH_SECRET: ci-only-secret-not-for-prod-bbbbbbbbbb
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm install

      - name: Prisma generate
        working-directory: api
        run: npx prisma generate

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

      - name: Run migrations against test DB
        working-directory: api
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: api
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (api)
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_API" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_API"
          else
            echo "RENDER_DEPLOY_HOOK_API not set — skipping API deploy"
          fi

      - name: Trigger Render deploy (worker)
        env:
          RENDER_DEPLOY_HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_WORKER" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_WORKER"
          else
            echo "RENDER_DEPLOY_HOOK_WORKER not set — skipping worker deploy"
          fi

      # Vercel auto-deploys the frontend on push to main once the repo is
      # connected in the Vercel dashboard — no extra step needed here.